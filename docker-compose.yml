services:

  api-service:
    build: .
    container_name: oci-arm-api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./keys:/app/keys

  monitor-service:
    build: .
    container_name: oci-arm-monitor
    restart: always
    command: python -m app.monitor
    env_file:
      - .env
    volumes:
      - ./keys:/app/keys